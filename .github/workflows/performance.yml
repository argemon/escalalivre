name: Performance evidence
on: workflow_dispatch
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci --prefix frontend --include=dev
      - name: Fresh snapshot and instrumented Release build
        run: |
          node tools/performance-benchmark.cjs snapshot . "$RUNNER_TEMP/performance"
          node tools/performance-benchmark.cjs build "$RUNNER_TEMP/performance"
      - name: Warm core phases and real HTTP queue workers
        run: |
          node tools/performance-benchmark.cjs measure "$RUNNER_TEMP/performance" 5
          node tools/performance-http.cjs "$RUNNER_TEMP/performance" 3
      - name: Observed envelopes, alerts only across environments
        run: |
          node tools/performance-alerts.cjs calibrate "$RUNNER_TEMP/performance" > "$RUNNER_TEMP/performance/regression-budget.json"
          node tools/performance-alerts.cjs check docs/decisions/evidence/performance-current/regression-budget.json "$RUNNER_TEMP/performance" > "$RUNNER_TEMP/performance/alerts.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-evidence
          path: |
            ${{ runner.temp }}/performance/*.json
            ${{ runner.temp }}/performance/*.txt
            ${{ runner.temp }}/performance/inputs
